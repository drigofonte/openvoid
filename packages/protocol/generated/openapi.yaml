openapi: 3.1.0
info:
  title: openvoid Session API
  version: 0.1.0
tags: []
paths:
  /sessions:
    post:
      operationId: Sessions_create
      description: Create a new coding session. Returns 201 with the new session.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
  /sessions/{id}:
    get:
      operationId: Sessions_read
      description: Fetch a session by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: Sessions_remove
      description: Delete a session. Triggers Pod termination; the per-Pod git-finalizer sidecar pushes any edits to feat/<sessionId> during the grace period before exit.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Short machine-readable error code.
        message:
          type: string
          description: Human-readable message.
      description: Standard error response.
    CreateSessionRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          allOf:
            - $ref: '#/components/schemas/SessionMode'
          description: How the workspace is provisioned. When `new-app`, `repo` MUST be omitted and `prompt` is optional. When `import-repo`, `repo` is required and `prompt` MUST be omitted. Server-side validation enforces this conditional rule (`isCreateRequest`) and rejects mismatches with `400 invalid_request`.
        repo:
          type: string
          description: HTTPS Git URL of the workspace to clone (e.g. `https://github.com/<org>/<repo>`). Required when `mode == "import-repo"`; rejected when `mode == "new-app"`. SSH URLs (`git@host:org/repo.git`) are not supported in v1.
        prompt:
          type: string
          description: Free-form natural-language description of the app the user wants to build. Used in `new-app` mode to slugify the repo name and seed `app/scaffold-meta.json`. Truncated at 500 chars client-side; slug truncation is enforced server-side. Empty is accepted (falls back to `app-<suffix>`). Ignored in `import-repo` mode.
        branch:
          type: string
          description: Branch to check out at clone time (import-repo only). Defaults to `main`.
          default: main
        idleTimeoutSeconds:
          type: integer
          format: int32
          minimum: 0
          description: Operator stops the session after this much inactivity. Defaults to 1800 (30 min).
          default: 1800
      description: Request body for creating a new coding session.
    PendingPhase:
      type: string
      enum:
        - provisioning
        - seeding-scaffold
        - installing-deps
        - awaiting-dev-server
        - running-pre-ingress
        - awaiting-agent-session
      description: Boot sub-phase the session is currently in. Populated only when `status == Pending`; surfaces real init/agent progress to the Provisioning storyboard instead of a synthetic timer.
    Session:
      type: object
      required:
        - sessionId
        - status
      properties:
        sessionId:
          type: string
          description: ULID identifying the session. Stable for the session's lifetime.
        status:
          allOf:
            - $ref: '#/components/schemas/SessionPhase'
          description: Current lifecycle phase.
        pendingPhase:
          allOf:
            - $ref: '#/components/schemas/PendingPhase'
          description: Boot sub-phase. Present only when `status == Pending`; absent on `Running`, `Stopped`, `Stopping`, and `Failed`. Drives the Provisioning storyboard's active step.
        error:
          allOf:
            - $ref: '#/components/schemas/SessionError'
          description: Failure detail. Populated only when `status == Failed`; absent on every other status.
        endpointUrl:
          type: string
          description: Reachable URL of the agent (when status is Running). Empty until Phase 5/6.
        agentUrl:
          type: string
          format: uri
          description: Public URL of the OpenCode agent UI. Populated when status is Running. Edge auth-injection means the link Just Works in a browser — no password prompt.
        previewUrl:
          type: string
          format: uri
          description: Public URL of the user's live preview (typically port 3000). Populated when status is Running. Unauthenticated — anyone with the URL can reach the user's app.
        agentSessionId:
          type: string
          description: OpenCode session ID for the auto-seeded `Main` conversation, used to construct the agent-UI deep-link URL. Populated only when `status == Running` AND the pod was created with `mode == new-app` AND the in-cluster session-list probe has resolved the session. Absent on import-repo pods (those never auto-seed) and during the brief `awaiting-agent-session` window after pod boot.
        repo:
          type: string
          description: Git URL of the workspace cloned at session start.
        branch:
          type: string
          description: Branch checked out at session start.
        createdAt:
          type: string
          description: RFC 3339 timestamp the session was created.
      description: A coding session resource as exposed by the API.
    SessionError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable error code (e.g. `init_failed`, `agent_crashloop`, `dev_server_unhealthy`, `github_rate_limited`, `k8s_unavailable`).
        message:
          type: string
          description: Human-readable detail. Intended for operator logs and telemetry; do not render directly in the UI — landing maps `code` to safe copy.
      description: Failure detail attached to a Session when `status == Failed`. `code` is the stable machine-readable identifier landing maps to user-facing copy; `message` is for logs/telemetry and is NOT rendered to the user verbatim.
    SessionMode:
      type: string
      enum:
        - new-app
        - import-repo
      description: How the session's workspace is provisioned. `new-app` creates a fresh per-app repo on the platform GitHub org and seeds it from the canonical scaffold; `import-repo` clones a user-supplied HTTPS Git URL.
    SessionPhase:
      type: string
      enum:
        - Pending
        - Running
        - Stopping
        - Stopped
        - Failed
      description: Lifecycle phase of a coding session.
