# Local-only Kubernetes manifest for the Session API.
# Phase 5+ supersedes this with a Helm chart. For Phase 3 it ships as plain
# YAML applied by Tilt.
---
apiVersion: v1
kind: Namespace
metadata:
  name: openvoid-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: openvoid-sessions
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-api
  namespace: openvoid-system
---
# Session API needs to manage Pods + per-session Service + Ingress in the
# openvoid-sessions namespace, and needs to read the
# opencode-server-password Secret once at boot for edge auth-injection
# on the per-session agent Ingress.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: session-api-pods
  namespace: openvoid-sessions
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "get", "list", "delete"]
  # Read-only, scoped to named Secrets — least privilege. The Session
  # API needs:
  #   - opencode-server-password: to compute the `Basic <base64>`
  #     header that ingress-nginx injects on the agent ingress.
  #   - github-platform-creds: to read the platform GitHub org PAT at
  #     boot for the new-app entry point (creating per-app repos under
  #     the platform org). See
  #     docs/runbooks/platform-github-org-setup.md.
  # It must not be able to enumerate or read other Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["opencode-server-password", "github-platform-creds"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: session-api-pods
  namespace: openvoid-sessions
subjects:
  - kind: ServiceAccount
    name: session-api
    namespace: openvoid-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session-api-pods
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-api
  namespace: openvoid-system
  labels:
    app.kubernetes.io/name: session-api
    app.kubernetes.io/part-of: openvoid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: session-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-api
    spec:
      serviceAccountName: session-api
      containers:
        - name: session-api
          image: localhost:5001/openvoid/session-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            # Phase 7: env-driven routing config. kind defaults are
            # baked into client.ts/server.ts but setting them
            # explicitly here keeps the values visible at the manifest
            # level — DOKS (Phase 8) and Helm (Phase 9) only need to
            # override the values, not introduce them.
            - name: OPENVOID_DOMAIN_BASE
              value: "127.0.0.1.nip.io"
            - name: OPENVOID_URL_SCHEME
              value: "http"
            - name: OPENVOID_LANDING_ORIGIN
              value: "http://app.127.0.0.1.nip.io"
            # GitHub org under which the new-app entry point creates
            # per-app repos. The PAT lives in the github-platform-creds
            # Secret in openvoid-sessions; this env names which org
            # that token has permission against. Kubernetes does not
            # support cross-namespace secretKeyRef, so the Session API
            # reads the Secret at boot via the K8s API (RBAC on the
            # session-api-pods Role grants `get` on this Secret) —
            # mirroring the loadOpencodeAuthHeader pattern.
            - name: OPENVOID_PLATFORM_GITHUB_ORG
              value: "drigolabs"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: session-api
  namespace: openvoid-system
  labels:
    app.kubernetes.io/name: session-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: session-api
  ports:
    - name: http
      port: 4000
      targetPort: http
