# kind cluster configuration for openvoid local development.
#
# Single control-plane node is enough for v1 — saves CPU/RAM on the
# implementer's laptop, and the operator's reconcile loop doesn't care
# about a multi-node setup.
#
# The containerdConfigPatches block tells containerd to treat
# `localhost:5001` as an HTTP (not HTTPS) registry without TLS, so the
# in-cluster nodes can pull images we push from the host. This is the
# canonical pattern from kind.sigs.k8s.io/docs/user/local-registry/.
#
# Cluster name is `openvoid-local`, which produces context name
# `kind-openvoid-local` — predictable, so other scripts can reference
# it without dynamic discovery.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: openvoid-local

# kindnet, kind's default CNI, does not implement NetworkPolicy — policies
# apply cleanly and are silently ignored. The app data plane leans on
# NetworkPolicy to keep one app's session pod off another app's database, so
# without a policy-enforcing CNI that isolation test passes locally whether or
# not the policy is correct. Calico is installed by scripts/kind-up.sh.
# See docs/plans/2026-08-29-001-...-plan.md U3.
networking:
  disableDefaultCNI: true
  # kind's default pod CIDR, stated explicitly because the Calico Installation
  # in infra/local/calico-installation.yaml must declare the same value.
  # Deliberately not Calico's own 192.168.0.0/16 default, which collides with
  # the address range most home networks use.
  podSubnet: "10.244.0.0/16"

nodes:
  - role: control-plane
    # `ingress-ready=true` is the node label ingress-nginx pins onto via
    # nodeSelector (see infra/local/ingress-nginx-values.yaml). Combined
    # with extraPortMappings below and the controller's hostPort:enabled
    # values, the host reaches the cluster ingress at http://127.0.0.1/.
    # Pattern from kind.sigs.k8s.io/docs/user/ingress/.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
