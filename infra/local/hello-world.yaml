# A trivial nginx Pod + Service used to prove the cluster, image-pull,
# and port-forward path work end-to-end. Phase 2 of the v1 staged
# walkthrough — no openvoid code yet, just kubectl muscle memory.
#
# Apply:    kubectl apply -f infra/local/hello-world.yaml
# Tunnel:   kubectl port-forward svc/hello-world 8080:80 -n openvoid-system
# Verify:   curl http://localhost:8080
# Tear down: kubectl delete -f infra/local/hello-world.yaml
#
# The openvoid-system namespace is reused by Phase 5+ for the operator
# and Session API, so we create it here.
---
apiVersion: v1
kind: Namespace
metadata:
  name: openvoid-system
  labels:
    app.kubernetes.io/part-of: openvoid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: openvoid-system
  labels:
    app.kubernetes.io/name: hello-world
    app.kubernetes.io/part-of: openvoid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-world
        app.kubernetes.io/part-of: openvoid
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          # Sensible defaults so this fits on the lean DOKS s-2vcpu-4gb
          # node alongside everything else Phase 5+ adds.
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              memory: "64Mi"
          # nginx:alpine readiness — root path returns 200 once the
          # daemon is up.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: openvoid-system
  labels:
    app.kubernetes.io/name: hello-world
    app.kubernetes.io/part-of: openvoid
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hello-world
  ports:
    - name: http
      port: 80
      targetPort: http
