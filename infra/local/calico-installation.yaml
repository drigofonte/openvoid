# Calico CNI configuration for the local kind cluster.
#
# Applied by scripts/kind-up.sh after the tigera-operator manifest. Replaces
# kindnet, which does not enforce NetworkPolicy — see infra/local/kind-cluster.yaml.
apiVersion: operator.tigera.io/v1
kind: Installation
metadata:
  name: default
spec:
  calicoNetwork:
    ipPools:
      - name: default-ipv4-ippool
        blockSize: 26
        # Must match podSubnet in infra/local/kind-cluster.yaml.
        cidr: 10.244.0.0/16
        encapsulation: VXLANCrossSubnet
        natOutgoing: Enabled
        nodeSelector: all()
