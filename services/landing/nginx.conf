# nginx config for the openvoid landing page (static SPA).
# The image's main config (nginx:alpine default) provides the worker
# loop, mime types, etc. This file lands at /etc/nginx/conf.d/default.conf
# and replaces the default site.
#
# Single SPA fallback: every unknown path serves /index.html, so
# client-side routing (if it ever ships) won't 404. For Phase 7 there's
# only one route, but the fallback doesn't cost anything.

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Built JS/CSS bundles get a content-hashed filename from Vite, so
  # they're safe to cache aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
